name: Satori Dictionary Test

on:
  push:
    paths:
      - 'kampo-ghost/**'
      - '8-1/**'
      - 'tests/**'
      - '.github/workflows/test-satori.yml'
  pull_request:
    paths:
      - 'kampo-ghost/**'
      - '8-1/**'
      - 'tests/**'
      - '.github/workflows/test-satori.yml'

jobs:
  validate-satori:
    name: Validate Satori Dictionaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Validator Unit Tests
        run: |
          python -m unittest discover tests/

      - name: Run Satori Dictionary Validator
        run: |
          python tests/test_validator.py --target all

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: satori-test-report
          path: test_report.md
